          python3 "$GITHUB_WORKSPACE/patches/022-model-recovery.py" "source/$PROJECT"
          cp "$GITHUB_WORKSPACE/patches/MixerLyricsUiAcceptanceTest.kt" "source/$PROJECT/app/src/androidTest/java/app/remix/player/MixerLyricsUiAcceptanceTest.kt"
          cp "$GITHUB_WORKSPACE/patches/StudioAcceptanceTest.kt" "source/$PROJECT/app/src/androidTest/java/app/remix/player/StudioAcceptanceTest.kt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmp3lame0 gcc
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Static privacy and accessibility regression
        run: |
          python3 patches/quality-audit.py "source/$PROJECT"
          python3 patches/check-test-identities.py --selftest
      - name: Studio sound regression
        run: bash patches/run-studio-upgrade.sh "source/$PROJECT"
      - name: Karaoke and adaptive overlap regression
        run: bash patches/run-lyrics-overlap.sh "source/$PROJECT"
      - name: Whisper boundary word timing regression
        run: bash patches/run-whisper-window.sh "source/$PROJECT"
      - name: Measured offline transition energy regression
        run: bash patches/run-transition-energy.sh "source/$PROJECT"
      - name: Startup hierarchy gate regression
        run: python3 patches/test-startup-ui.py
      - name: Finite neural stem checkpoint regression
        run: bash patches/run-stem-finite.sh "source/$PROJECT"
      - name: Model download cancellation and verified completion
        run: bash patches/run-download-regression.sh "source/$PROJECT"
      - name: Quiet-window Whisper input regression
        run: bash patches/run-whisper-input.sh "source/$PROJECT"
      - name: Smart DJ actual audio regression
        run: bash patches/run-smart-dj.sh "source/$PROJECT"
      - name: Acoustic remix recommendation regression
        run: bash patches/run-advisor.sh "source/$PROJECT"
      - name: Effect menu coverage
        run: bash patches/run-effect-menu.sh "source/$PROJECT"
      - name: Model recovery policy regression
        run: bash patches/run-model-recovery.sh "source/$PROJECT"
      - name: Full regression
        working-directory: source/RemixPlayer_v0.66
        env:
          JAVA_OPTS: -Xmx2g
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/host-logs"
          bash tests/run-core.sh 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/core.log"
      - name: Native and syntax checks
        if: always()
        working-directory: source/RemixPlayer_v0.66
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/host-logs"
          bash tests/run-syntax-audit.sh 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/syntax.log"
          bash tests/run-mp3-host.sh 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/mp3.log"
          python3 tests/test-native-audit.py 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/native-test.log"
          python3 tests/test-release-gates.py 2>&1 | tee "$GITHUB_WORKSPACE/host-logs/release-gates.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Host-test-logs
          path: host-logs/
          if-no-files-found: ignore

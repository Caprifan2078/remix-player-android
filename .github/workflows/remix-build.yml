      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android toolchain for lint
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$manager"
          "$manager" --version
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle --no-daemon :app:lintDebug --stacktrace
        working-directory: source/RemixPlayer_v0.66
      - name: Print lint issue details
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          path = Path("source") / os.environ["PROJECT"] / "app/build/reports/lint-results-debug.xml"
          if not path.exists():
              print("No XML lint report generated")
          else:
              for issue in ET.parse(path).getroot().findall("issue"):
                  loc = issue.find("location")
                  where = "" if loc is None else f"{loc.get('file','')}:{loc.get('line','')}"
                  print(f"{issue.get('severity')} {issue.get('id')} {where}: {issue.get('message')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lint-report
          path: source/RemixPlayer_v0.66/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  candidate:
    name: Automated acceptance candidate (manual QA still required)
    needs: [apk, host, native, smoke, lint, real-models]
    if: ${{ always() && needs.apk.result == 'success' && needs.host.result == 'success' && needs.native.result == 'success' && needs.smoke.result == 'success' && needs.lint.result == 'success' && needs.real-models.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {name: RemixPlayer-v0.66-debug-UNVERIFIED, path: candidate}
      - run: sha256sum candidate/app-debug.apk > candidate/apk.sha256
      - uses: actions/download-artifact@v4
        with: {name: RemixPlayer-v0.66-arm64-UNVERIFIED, path: arm64}
      - run: (cd arm64 && sha256sum -c apk.sha256)
      - uses: actions/upload-artifact@v4
        with: {name: RemixPlayer-v0.66-arm64-QA-candidate, path: arm64/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: RemixPlayer-v0.66-automated-QA-candidate, path: candidate/, if-no-files-found: error}

  real-models:
    name: Real models on Android 15 (8 GiB emulator)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: RemixPlayer-v0.66-debug-UNVERIFIED, path: apk}
      - uses: actions/download-artifact@v4
        with: {name: Real-model-instrumentation, path: test-apk}
      - name: Prepare synthetic speech fixture
        run: |
          set -euo pipefail
          mkdir -p model-fixtures
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -v en-us -s 135 -w model-fixtures/qa-whisper.wav 'The music is playing. Listen to the song today. This is a test.'
          curl --fail --location --retry 2 --max-time 240 --proto '=https' --proto-redir '=https' --max-filesize 80000000 -o model-fixtures/qa-whisper-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          printf '%s  %s\n' be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 model-fixtures/qa-whisper-tiny.bin | sha256sum -c -
          test "$(stat -c %s model-fixtures/qa-whisper-tiny.bin)" = 77691713
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check emulator host resources
        run: |
          mkdir -p "$HOME/.android/avd"
          free -h
          df -h "$HOME/.android/avd"
          test "$(awk '/MemTotal:/{print $2}' /proc/meminfo)" -ge 11534336
          test "$(df -Pk "$HOME/.android/avd" | awk 'NR==2 {print $4}')" -ge 8388608
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 8192M
          disk-size: 6G
          script: bash model-qa/run-combined-models.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Real-model-results
          path: model-results/
          if-no-files-found: warn

# Place at .github/workflows/remix-build.yml in a dedicated private repository.
# Place RemixPlayer_v0.66_source.zip at the repository root, unchanged.
name: Remix Player 0.66 - first APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RemixPlayer_v0.66_source.zip'
      - '.github/workflows/remix-build.yml'
      - 'patches/**'
      - 'model-qa/**'
  pull_request:
    paths:
      - 'RemixPlayer_v0.66_source.zip'
      - '.github/workflows/remix-build.yml'
      - 'patches/**'
      - 'model-qa/**'
permissions:
  contents: read
concurrency:
  group: remix-build-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_ZIP: RemixPlayer_v0.66_source.zip
  SOURCE_SHA256: 8ebc8cf15b4bc7a34a674bc7a927d69fd54026f2bbf6289cf2fe4ad8dedf4ba2
  PROJECT: RemixPlayer_v0.66
jobs:
  apk:
    name: Compile and package APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract original source
        run: |
          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum -c -
          unzip -q "$SOURCE_ZIP" -d source
          patch --batch --forward -d "source/$PROJECT" -p1 < "$GITHUB_WORKSPACE/patches/001-media-controller-import.patch"
          patch --batch --forward -d "source/$PROJECT" -p1 < "$GITHUB_WORKSPACE/patches/002-mainactivity-media3-opt-in.patch"
          python3 "$GITHUB_WORKSPACE/patches/003-runtime-qa.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/004-accessibility-privacy.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/005-ui-qa.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/006-playback-regression.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/007-mixer-resume.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/008-mixer-compact.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/009-studio-sound.py" "source/$PROJECT"
          patch --batch --forward -d "source/$PROJECT" -p1 < "$GITHUB_WORKSPACE/patches/010-lyrics-overlap.patch"
          python3 "$GITHUB_WORKSPACE/patches/010-karaoke-ui.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/011-lyrics-follow.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/012-whisper-window.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/013-transition-energy.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/014-stem-finite.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/015-download-cancel.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/016-whisper-input.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/017-overlap-stall.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/018-audio-output-safety.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/019-spatial-lyrics.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/020-genre-kick.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/021-search-ci-audit.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/022-smart-mix.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/023-model-cdn.py" "source/$PROJECT"
          cp "$GITHUB_WORKSPACE/patches/WhisperDownload.kt" "$GITHUB_WORKSPACE/patches/ModelMemoryBudget.kt" "source/$PROJECT/app/src/main/java/app/remix/player/"
          python3 "$GITHUB_WORKSPACE/patches/024-model-recovery.py" "source/$PROJECT"
          cp "$GITHUB_WORKSPACE/patches/DjTransition.kt" "$GITHUB_WORKSPACE/patches/RemixAdvisor.kt" "source/$PROJECT/app/src/main/java/app/remix/player/"
          python3 "$GITHUB_WORKSPACE/patches/025-smart-dj.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/026-advisor-ui.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/027-mix-quality.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/028-live-recovery.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/029-radio-similarity.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/030-transition-level-cache.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/031-audio-performance.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/032-eq-pcm-quality.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/033-two-genres.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/034-power-lyrics-widget.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/035-studio-widget.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/036-tempo-search.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/037-fast-text-search.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/038-wave-player.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/039-handoff-guard.py" "source/$PROJECT"
          python3 "$GITHUB_WORKSPACE/patches/040-clean-player.py" "source/$PROJECT"
          cp "$GITHUB_WORKSPACE/patches/MixerLyricsUiAcceptanceTest.kt" "source/$PROJECT/app/src/androidTest/java/app/remix/player/MixerLyricsUiAcceptanceTest.kt"
          cp "$GITHUB_WORKSPACE/patches/StudioAcceptanceTest.kt" "source/$PROJECT/app/src/androidTest/java/app/remix/player/StudioAcceptanceTest.kt"
          test -f "source/$PROJECT/app/build.gradle.kts"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$manager"
          "$manager" --version
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native MP3 and Whisper
        working-directory: source/RemixPlayer_v0.66
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          bash scripts/build-mp3-android.sh 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/mp3.log"
          bash scripts/build-whisper-android.sh 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/whisper.log"
      - name: Compile application
        working-directory: source/RemixPlayer_v0.66
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/assemble.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee "$GITHUB_WORKSPACE/diagnostics/apk.sha256"
      - name: Save APK before further checks
        uses: actions/upload-artifact@v4
        with:
          name: RemixPlayer-v0.66-debug-UNVERIFIED
          path: source/RemixPlayer_v0.66/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package and verify ARM64-only debug APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          tools="$sdk/build-tools/35.0.0"
          source_apk="source/$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p arm64
          python3 patches/arm64-apk.py filter "$source_apk" "$RUNNER_TEMP/arm64-unsigned.apk"
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/arm64-unsigned.apk" "$RUNNER_TEMP/arm64-aligned.apk"
          "$tools/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out arm64/RemixPlayer-v0.66-arm64.apk "$RUNNER_TEMP/arm64-aligned.apk"
          "$tools/zipalign" -c -P 16 4 arm64/RemixPlayer-v0.66-arm64.apk
          "$tools/apksigner" verify --print-certs "$source_apk" > "$RUNNER_TEMP/universal-certs.txt"
          "$tools/apksigner" verify --print-certs arm64/RemixPlayer-v0.66-arm64.apk > "$RUNNER_TEMP/arm64-certs.txt"
          diff <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/universal-certs.txt") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/arm64-certs.txt")
          python3 patches/arm64-apk.py verify "$source_apk" arm64/RemixPlayer-v0.66-arm64.apk
          (cd arm64 && sha256sum RemixPlayer-v0.66-arm64.apk > apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: RemixPlayer-v0.66-arm64-UNVERIFIED
          path: arm64/
          if-no-files-found: error
      - name: Compile instrumentation tests
        working-directory: source/RemixPlayer_v0.66
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/instrumentation-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: RemixPlayer-v0.66-instrumentation
          path: source/RemixPlayer_v0.66/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Compile real-model test instrumentation separately
        run: |
          set -euo pipefail
          cp model-qa/RealModelAcceptanceTest.kt model-qa/DirectWhisperDownloadTest.kt "source/$PROJECT/app/src/androidTest/java/app/remix/player/"
          cd "source/$PROJECT"
          gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Real-model-instrumentation
          path: source/RemixPlayer_v0.66/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

          name: RemixPlayer-v0.66-debug-UNVERIFIED
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: RemixPlayer-v0.66-instrumentation
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: bash patches/deep-emulator.sh source/RemixPlayer_v0.66 apk/app-debug.apk test-apk/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-api-${{ matrix.api }}
          path: smoke-output/
          if-no-files-found: ignore

